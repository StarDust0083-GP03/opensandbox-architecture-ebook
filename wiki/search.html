i/devops.py 纯文本排障路由 server/opensandbox_server/services/diagnostics.py 诊断上下文与内容描述符 components/nodeagent/pkg/marker/ 完整性标记 components/nodeagent/pkg/pipeline/ 有界队列与背压 docs/guides/telemetry.md 各组件指标清单与配置 docs/architecture/data-plane/node-agent.md 采集语义与保证"},{"title":"运维与失败：这套系统承诺什么，不承诺什么","slug":"17-operations","text":"运维与失败：这套系统承诺什么，不承诺什么 前面十六篇讲的是「它怎么工作」。这一篇讲它在坏掉的时候长什么样。 判断一个基础设施项目的成熟度，最有效的办法不是看功能表，而是看它敢不敢写清「这里会中断」「这里不保证」「这里要人工」。OpenSandbox 的文档在这方面出乎意料地直接，这一篇基本是在整理它的自我限制清单，并补上我的解读。 部署顺序不是建议，是依赖 Kubernetes 部署有固定顺序： 每一步的理由都写在文档里： 步骤 chart 为什么在这个位置 --- --- --- 1 base 拥有 sandbox.opensandbox.io 与 sandbox.fast.io 的 CRD 与 RBAC，其他一切都依赖这些对象存在；每集群装一次 2 opensandbox-controller reconcile 你和服务器创建的 BatchSandbox / Pool / SandboxSnapshot 3 fast-sandbox （可选） 必须在 server 之前：服务器的 fsb 配置指向 FastPath gRPC endpoint（ fast-sandbox-fastpath...svc:9090 ），启动时就开始 watch sandbox.fast.io 对象 4 ingress-gateway Kubernetes 部署必需 ：沙箱 Pod 只有 ClusterIP，客户端流量必须经网关；且要在 server 之前装，服务器才能在首次安装时就宣告它 5 opensandbox-server 生命周期 REST API 6 opensandbox-node-agent （可选） 顺序无关 第 4 条最容易被跳过，后果也最直接：跳过网关，沙箱创建成功但谁也访问不到。文档把它写成「required for Kubernetes deployments」而不是「recommended」。 用 umbrella chart 时这个顺序由 chart 处理。注意它需要先 helm dependency build opensandbox —— charts/ 目录在仓库里是 git-ignored 的，每次重建。chart 从 release-X.Y.Z 标签的 checkout 安装， 不单独发布 chart 包 。 服务器的高可用承诺有多窄 这是全文档里最值得逐字读的一段： The chart defaults to server.replicaCount: 1 . Keep one active Lifecycle Server unless you deliberately use the PostgreSQL-backed Kubernetes public snapshot topology... That exception coordinates public snapshots only; it does not provide general multi-replica Server HA. The Server Deployment uses the Recreate strategy so an upgrade stops the active Server before starting its replacement; expect a brief API interruption during upgrades. 拆开来是四个明确事实： 1. 默认单副本 ，升级时会短暂中断 API（ Recreate 策略：先停后起，不并存）。 2. 多副本只有一个合法场景 ：PostgreSQL + Kubernetes runtime，且 只协调公开快照 。 3. SQLite 与 Docker 快照执行不支持这个多活拓扑 。 4. 文档在别处还写了一句更直白的：「General load-balanced lifecycle HA is not supported yet — and is not pretended.」 第 4 条的语言很少见。大多数项目会把「部分多活」写成「高可用」，这里选择把它写成它本来的样子。 顺带一个对比：Controller 的 chart 默认 开启 leader election（ leaderElection.enabled: true ），因为它本来就是 Kubernetes 风格的控制器；而生命周期服务器不是，它没有 leader election，只有「一个副本」这个操作约定。两种风格并存，说明作者没有为了统一而统一。 Fast Sandbox 的失败表 Fast Sandbox 的文档给了一张很干净的失败矩阵： 失败 影响 恢复 --- --- --- 控制面重启 短暂失去变更能力；运行中沙箱不受影响 CR 驱动重放意图 Fastlet Pod 丢失 该 Fastlet 上的沙箱中断 按每沙箱 failurePolicy ，在 recoveryTimeoutSeconds （默认 60 秒）后处理；默认人工 服务器重启 沙箱无影响；未完成操作从持久记录继续 同一套观察-收敛 制品 store 故障 新启动降级为直接拉取；运行中沙箱不受影响 store 恢复后 DART 继续服务 第二行是唯一的「会丢东西」的情况，而且是 默认人工 。这是一个刻意的选择：自动把沙箱迁到别的节点，需要先决定「未持久化的写入怎么办」，而这个决定属于业务，不属于平台。 容量规划：三处容易被忽略的账 池容量。 bufferMin / bufferMax 决定稳态快， poolMin / poolMax 决定上限。配小了会频繁 429 ；配大了会白占资源。文档给的调节旋钮是 maxUnavailable （默认 25%）和池的模板 revision 滚动。 快照的 registry 与保留。 Kubernetes 后端的快照镜像要推到 registry，凭据配在 controller manager 启动参数 上（ --snapshot-image-uri-template 之类的也在那里）， 不在 ~/.sandbox.toml 。文档专门强调这一点，因为它和大多数人的直觉相反：快照是控制器做的，不是服务器做的。 另外： 删除快照记录不会删除已推送的镜像 。保留与清理是运维策略，被有意留在沙箱生命周期之外。这意味着如果你不主动清理，registry 会一直涨。 节点状态盘。 Firecracker 的每沙箱 rootfs 是 XFS reflink 的 CoW 副本，所以节点状态根必须在 XFS + reflink 上。文档给了准备步骤（新建空盘 mkfs.xfs -m reflink=1 、挂载、 blkid 、写入 fstab），也给了没有额外设备时的 scripts/fast-sandbox-state-root-setup.sh （用 fallocate 预留空间建 loop 文件系统，拒绝已存在的 backing file、符号链接路径、已挂载目标与非空挂载点，失败时保留文件供检查而不是冒险删除）。 容量口径也写得很实：要按「每个被缓存模板的 rootfs + guest 内存快照 + 活跃沙箱可写数据 + 缓存开销」算，起步留 50% 余量，并保持 10 GiB 空闲 （默认就绪地板）。 还有一条运维动作容易做错：如果节点已经在跑沙箱，你新挂了状态盘， 已运行的沙箱可能还看着旧文件系统 。正确做法是先 drain 该节点沙箱，再重启 runtime Pod；或者在部署 runtime DaemonSet 之前 就把盘准备好。 三个「已知不可靠」的明确声明 文档里有三处主动说明「这块还没被验证到位」，我认为这是这一篇最重要的内容。 1. Node Agent 的资源默认值没有基准。 数据面文档写明：采集与投递已实现，但生产的资源默认值仍在等 benchmark 与 soak 结果（OSEP-0019），「把 chart 的资源值当作起点」。 2. Fast Sandbox 并发 20 的创建不可靠。 Performance 页写明：并发 20 的延迟分布 只含成功的尝试 ，48 次 SandboxRateLimitException （HTTP 429 / Fastlet CapacityRejected ）与 1 次就绪超时被排除；有 4 个测试 CR 卡在删除中，原因是 assignment annotation/status projection 冲突。文档的结论是：这次运行不建立「可靠的 20 路接纳」或「可持续 RPS」，实现层面的原因需要单独修， 换宿主磁盘解决不了 。 3. 同节点恢复的 62 秒无人解释。 运行时恢复是几十毫秒，但 SDK 侧恢复中位 62.66 秒。文档明确说：日志显示路由在恢复后立刻发布，大部分时间在 endpoint/guest 可用性与客户端等待上；这次测量 没有隔离出 是网络、网关、endpoint 解析还是重试机制造成的差距，也明确禁止把运行时数字当作 SDK 恢复数字。 这三条的共同点是： 它们都给出了「不要用哪个数字做承诺」 。这比多写三个功能有用。 升级与镜像可信 两条与升级相关的实践： 镜像按 digest 固定。 发布镜像在三个官方 registry（Docker Hub、GHCR、阿里云 ACR）以同名组件发布；带标签的发布镜像用 Cosign 做无密钥签名并带 provenance 证明。生产要按 digest 固定，并按 docs/community/release-verification.md 对照 OpenSandbox 的 GitHub Actions 身份验证。 旧镜像的坑要记住。 单机网络文档提过一个具体例子： server/v0.2.3 把内部 IP 解析硬编码在两条代理路径里，只设 resolve_internal = false 救不回来，SDK 就绪检查会超时；修好的镜像是 release-1.1.0 。文档还提醒 server/v 这类冻结标签不再标识较新的服务器发布，现在用统一发布标签。 这段的价值在于它示范了「兼容性说明要写到版本号一级」。 排障顺序建议 把第 16 篇的五层证据和这一篇的失败矩阵合起来，我建议的排障顺序是： 1. 看状态 ： GET /sandboxes/{id} 的 state / reason / message ，先分清是「没创建」「创建了但没就绪」「就绪但访问不到」。 2. 看条件 ：Kubernetes 上 kubectl describe batchsandbox ，特别是有没有 PoolAllocationPending ；Fast Sandbox 上看 sandbox.fast.io CR 的 status.runtime 。 3. 看 endpoint ： GET .../endpoints/{port} 的形态是否符合预期（直连/网关/代理），头是否带全。 4. 看数据面 ： /ping 是否 200；不行再取 diagnostics/logs ，注意 truncated 。 5. 看指标与日志 ：egress 的「拒绝」与「解析失败」分开看；ingress 的 network-readiness 只看它的影子信号含义。 6. 查已知限制 ：并发创建 429、池满、暂停后 vault 为空、 404 不代表进程已死。 第 6 步经常被跳过，而它往往是最快的答案。 本章要点 - 部署顺序是依赖：CRD → controller → (fast-sandbox) → ingress-gateway → server；K8s 下沙箱 Pod 只有 ClusterIP，缺网关等于访问不到。 - 服务器默认单副本、升级会短暂中断；多副本只允许 PostgreSQL + K8s runtime 且只协调公开快照；SQLite/Docker 不支持。 - Controller 默认开启 leader election；生命周期服务器没有，靠单副本约定。 - Fast Sandbox 控制面单副本是设计立场；Fastlet 丢失默认人工恢复（60 秒后按 failurePolicy ）。 - 三处账要单独算：池容量、快照 registry 与保留（删记录不删镜像）、节点 XFS reflink 状态盘与 10 GiB 地板。 - 文档主动声明三处「未验证到位」：node agent 资源默认值、并发 20 创建、同节点恢复 62 秒。 - 镜像按 digest 固定并做 Cosign 验证； server/v 冻结标签不再代表新版本。 本章源码入口 路径 看什么 --- --- docs/deployment/index.md 部署顺序、单副本约束、PostgreSQL 拓扑 manifests/charts/opensandbox/ umbrella chart 与子 chart 依赖 manifests/charts/controller/values.yaml leader election 与快照 registry 配置 manifests/charts/node-agent/ 采集目标与资源默认值 docs/guides/pause-resume.md registry/Secret 配置与暂停的中断语义 docs/community/release-verification.md 镜像签名与验证流程"},{"title":"权衡：这套设计放弃了什么","slug":"18-tradeoffs","text":"权衡：这套设计放弃了什么 前十七篇解释「为什么这么设计」。这一篇做反面：每个设计决定都放弃了什么，以及在什么条件下这些取舍会失效。 我按「影响面」排序，从最结构性的开始。 一、前缀分发换零状态路由 fsb- 前缀决定走哪个后端。 得到的 ：不需要「sandbox → backend」映射表，因此不需要维护它的一致性，控制面重启也不需要恢复它。 放弃的 ：显式路由。前缀是隐式契约，被 SDK、文档、运维手册同时依赖；任何一个后端漏加前缀，路由会静默走错分支——不是崩溃，是错误行为。 什么时候失效 ：出现第三个后端时。两个分支用前缀是划算的，三个就开始需要真正的注册表。 二、一条契约换后端能力差异 得到的 ：调用方学一次，本地 Docker 到集群可以平滑迁移；SDK 一种实现覆盖全部后端。 放弃的 ：能力可表达性。类型系统无法表达「这个后端返回的 endpoint 不支持任意 TCP 转发」「这个后端的暂停不保留内存」「这个后端的 vault 在恢复后是空的」。这些差异只能写进 implementation-compatibility.md 和每个后端的指南。 代价落在谁身上 ：写代码的人（他要读文档），以及维护者（他要在三处同步语义）。 替代方案 是能力协商端点。文档明确说当前 没有 通用能力协商，也承认 OPEN-SANDBOX-ORIGIN 之类的信号「是现有的路由信号，不是通用能力清单」。这是一个诚实的欠账，不是遗漏。 三、预热换请求级定制 得到的 ：常数时间创建。100 个沙箱 0.92 秒（池化）与 76 秒级（非池化）的对比就是它的价值。 放弃的 ：每个请求定制环境的能力。 entrypoint / env 变成分配后的 task，卷与 networkPolicy 不能与 poolRef 共用，池 Pod 必须满足 task 契约。 额外的代价 ：数据面必须处理「复用」带来的身份问题。execd 的 per-allocation 绑定、未绑定时业务端点 503、以及 Fast Sandbox 的 subject 状态机，都是为这一条付的账。 什么时候失效 ：当每个请求都需要不同的镜像或系统依赖时，预热池的价值会被「池里没有我要的模板」抵消。这时候正确的做法是多个池，而不是放弃预热。 四、sidecar 换共享 egress 得到的 ：单机与 Pod 内隔离干净，每沙箱策略互不影响，工作负载没有 NET_ADMIN 。 放弃的 ：密度。N 个沙箱 N 个 sidecar，每个都要自己的 DNS 代理与规则。 Fast Sandbox 选了另一头：每个 Fastlet 一个 egress 进程，服务 N 个 subject。这换回了密度，代价是 执行路径显著变复杂 ：按源 IP 分发、per-subject nft 链、master 链只标记不发 accept、租约与刷新循环、以及「管理面 endpoint 必须对所有 subject 隐藏」这类细节。 这条权衡没有全局最优解 ，只有「在什么密度下选哪边」。文档把它写成了两个互斥的 profile，我认为这是正确的处理方式：不假装一套实现能同时最优。 五、fail-closed 换可用性 这个项目在多处选择了「宁可失败，不要降级」： 位置 选择 放弃的东西 --- --- --- 启动期检查 没 key / 租户空间不可达 / 安全运行时不可用 → 退出 部分可用性 egress 启动 装不上重定向规则 → 退出，绝不空跑 沙箱可用性（如果有 bug） egress 重载 解析失败保留上一份已接受规则 「立即生效」 Vault socket 任何异常 fail closed（503 或断开） 请求成功率 OSEP-0023 实验面 任何不确定 → 锁存恢复状态，重启不算恢复 快速自愈 这套选择的前提是： 这些子系统一旦降级，失败是静默的 。egress 空跑不会报错，只会放行流量；Vault 不注入不会报错，只会让请求变成未认证。静默的安全降级比中断危险得多，所以选择中断。 代价 ：sidecar 的一个 bug 可以让整个沙箱不可用；Vault socket 成为数据面硬依赖。文档把这条写成运维要求（监控 sidecar 与私有 socket），而不是隐藏它。 六、单活控制面换实现简单 得到的 ：没有 leader election、没有分布式锁、状态机是单线程思维；快照的双副本协调只需三条不变量（先观察再创建、终态 CAS、恢复扫描）。 放弃的 ：控制面可用性。升级时短暂中断；服务器崩溃时无法创建/删除沙箱（运行中的沙箱不受影响）。 为什么可以接受 ：控制面的故障域与数据面解耦。沙箱里跑的命令不会因为控制面重启而中断。这是第 2 篇「两个平面」划分的直接收益。 什么时候失效 ：当控制面调用密集到升级窗口无法接受时（例如大规模 RL 训练每秒创建上百个沙箱）。ROADMAP 里「System-wide high availability」仍是 Planned，说明这个阈值还没被到达，或还没被解决。 七、静态文档换能力协商 兼容性文档承担了「能力清单」的职责。它有效的原因是 它准确且有人维护 ；它脆的原因是 没有机器可读的校验 。 一个具体的风险：文档说「Kubernetes rootfs 快照提交器拒绝 gVisor RuntimeClass」。如果某天这个限制被解除，文档不改，用户就会继续避开一个已经不存在的坑——这是软性的损失。反过来如果新增限制没写，用户会撞上一个没人告知的失败。 替代方案 是能力发现端点，或者把限制编码进错误码/错误消息。上游已经有一半： /v1/isolated/capabilities 、 OPEN-SANDBOX-ORIGIN 头、 DIAGNOSTICS_ 错误码。这些是局部的能力发现，缺的是全局的。 八、SSE 换双向流 数据面用 SSE 而不是 WebSocket（PTY 除外）。 得到的 ：浏览器与普通 HTTP 客户端都能消费；代理友好；实现简单（一行 data: {...}\\n\\n ）。 放弃的 ：双向控制通道。所以要中断命令只能另发一个 DELETE /command ；所以「客户端断开」与「命令失败」必须用事件语义区分（第 9 篇那三条语义正是为此）。 付过的代价 ： exit_code 字段的加入让老 SDK 崩溃（kotlinx-serialization 的未知字段问题）。这是一个很好的教训： 在强类型客户端生态里，给事件加字段不是向后兼容的操作 ，除非客户端屏蔽了自己的序列化运行时。 九、绝对 TTL 换空闲友好 得到的 ：寿命可审计，从创建时间就能算；重启不重置。 放弃的 ：符合直觉的「用着就不会过期」。为此需要另外两个机制补：renew-on-access 与空闲暂停。 这三个机制（绝对 TTL、访问续期、空闲暂停）合起来其实是一套更复杂的语义，比单纯的 idle timeout 复杂。这是「可审计」这个属性换来的复杂度——它换来的是「这个沙箱为什么还活着」永远有一个确定答案。 十、三种后端各有一套持久性语义 暂停保留 持久性保证 --- --- --- Docker 进程现场（冻结） commit 成本地镜像后才持久，且只在这台机器 Kubernetes rootfs（内存仅在 QEMU 模式） 快照 Succeed + 镜像已推送 Fast Sandbox rootfs + vmstate + 内存 检查点完整落 store 才算 Paused 这三行的差异是能力差异，不是实现细节。它们没法被契约统一，只能被文档说明。 教学推演 ：如果重来一次，我会考虑把「持久性等级」做成创建请求里的显式字段（例如 durability: none rootfs memory ），让不支持该等级的后端直接拒绝请求。这样调用方能声明意图，而不是读文档猜。这是本书里我最想提的一个改动建议。 如果你在做类似系统 把上面的十条压成一张判断表，供参考： 你的条件 建议 --- --- 只有两个后端 前缀/枚举分发可以接受，别急着做注册表 后端会持续增加 从第一天就做「能力声明」而不是「能力文档」 创建延迟是核心指标 预热 + 池化，但要同时设计「复用时的身份重置」 沙箱密度要求高 共享数据面基础设施，但要准备接受执行路径的复杂度 子系统的失败是静默的 fail closed，并监控那个「硬依赖」 控制面调用不密集 单活 + 明确的中断窗口声明，胜过多活带来的分布式复杂度 有多种持久性语义 让调用方显式声明等级，别让文档承担这个职责 一个整体判断 这套设计最值得学的地方不是任何一个机制，而是 它把不确定写进了接口和文档 ： - 状态带 reason ； - 诊断带 truncated ； - 日志带 complete / incomplete ； - 指标把「拒绝」与「坏了」分开； - 文档写「这里不保证」「这次测量不建立结论」「这个限制仍在」； - 紧凑的地方（并发 20、恢复 62 秒、node agent 默认值）主动标注为未验证。 一个系统愿意承认这些，说明它的作者知道平台类软件的真正风险不是「功能少」，而是「用户以为它有某个保证而其实没有」。第 19 篇会用一次请求把这份清单重新走一遍。 本章要点 - 十个结构性权衡：前缀分发、单契约、预热、sidecar vs 共享、fail-closed、单活、静态文档、SSE、绝对 TTL、三种持久性语义。 - 每个取舍都有「什么时候失效」的条件，而不是无条件正确。 - fail-closed 的前提是「降级是静默的」；静默的安全降级比中断更危险。 - 单活控制面可接受，因为控制面故障域与数据面解耦。 - 静态兼容性文档是当前的能力清单，但没有机器可读校验；局部能力发现（ /capabilities 、 OPEN-SANDBOX-ORIGIN ）已经存在。 - 最值得改的一处：把持久性等级变成创建请求里的显式字段。 本章源码入口 路径 看什么 --- --- docs/api/implementation-compatibility.md 「能力靠文档」的现状 server/opensandbox_server/services/composite_service.py 前缀分发的全部逻辑 docs/architecture/fast-sandbox/ha.md 单控制面的立场陈述 docs/guides/pause-resume.md 三种持久性语义中最复杂的一种 components/egress/pkg/startup/ fail-closed 的启动实现 ROADMAP.md 哪些欠账被公开承认"},{"title":"完结篇：跟着一次请求走完全书","slug":"19-wrap-up","text":"完结篇：跟着一次请求走完全书 这一篇把全书串一遍。场景是第 1 篇那个修 bug 的编码 Agent：它要为一次任务申请一个沙箱，跑测试，装一个依赖，改代码，再跑一次，最后交 diff。 请求： POST /v1/sandboxes 客户端带着 OPEN-SANDBOX-API-KEY ，body 里是一份意图： 这份 JSON 里每个字段都对应前面某一篇的一个机制： 字段 由谁处理 在哪一篇 --- --- --- image 运行时后端创建容器/工作负载 6 / 7 entrypoint 容器入口或分配后的 task 6 / 7 resourceLimits 后端翻译成容器限额或 Pod 资源 6 / 7 timeout 绝对 TTL + 过期定时器/ expireTime 13 networkPolicy egress sidecar 或共享 egress subject 11 credentialProxy 挂 egress 并启用 MITM 与 vault 12 idlePolicy 空闲扫描器 + 唤醒路径 13 metadata 标签/注解，可被列表过滤 4 / 6 第 1 毫秒：控制面 RequestIdMiddleware 生成或透传请求 ID。 AuthMiddleware 校验 key：单租户比对 server.api_key ，多租户交给 TenantProvider 并把租户命名空间写进 ContextVar （第 14 篇）。 路由进入 api.lifecycle.create_sandbox ，四步校验： extensions 合法性、renewal 与 extensions 的冲突、 networkPolicy 归一化、 snapshotId 解析（这里没有 snapshot，跳过）。然后委派给 sandbox_service （第 4 篇）。 因为 runtime.type = \"kubernetes\" ，实际对象是 CompositeSandboxService ；因为没有 templateId ，请求走到 KubernetesSandboxService （第 5 篇）。 第一个 100 毫秒：认领容量 服务器创建 BatchSandbox ，带 expireTime 、Pod 模板合并后的资源与平台约束、egress sidecar 的追加、以及网络策略的注解。 如果集群里有 Pool ，控制器会把一个 已经 Running+Ready 的预热 Pod 标注给这个 BatchSandbox ，写 alloc-status 注解； entrypoint 作为分配后的 task 下发，而不是改写 Pod。如果池空了，控制器写 PoolAllocationPending （reason PoolCapacityExhausted ），服务器在有界窗口内等待，超时返回可重试的 429 （第 7 篇）。 这条路径之所以是毫秒级，是因为调度、拉镜像、启动都发生在 请求之前 。这就是第 1 篇那条「快在已经存在的容量上」的兑现。 就绪：从 Pending 到 Running 服务器等工作负载进入 Running / Allocated （默认 60 秒上限），然后返回创建响应。客户端拿到的是一个 Pending 或 Running 的沙箱对象，带 state / reason / message (第 4 篇)。它至此不再需要轮询创建接口，而是从这个沙箱对象读所有后续状态。 同时发生的还有两件事： - egress sidecar 已经把 DNS 与 nftables 规则装好，默认拒绝，只放行 pypi 与 github（第 11 篇）； - execd 在容器里启动，等待 per-allocation 绑定；绑定未完成前，除 /ping / /ready 外全部返回 503 （第 9 篇）。 接入：解析 endpoint 客户端要跑命令，于是 GET /sandboxes/{id}/endpoints/44772 。 服务器返回一个地址 + 需要的头。在 Kubernetes + ingress 部署下，通常是网关地址加 OpenSandbox-Ingress-To: -44772 ；开了 secureAccess 时还带 endpoint 凭据；Fast Sandbox 的返回则是一个签名的 f1. scope（第 8、10 篇）。 这一步的返回值是凭据，不是普通字符串。 客户端要原样保留，不能丢头、不能截断路径。 干活：一次命令执行 客户端 POST /command ，body 指定 argv 或 shell 语法。execd 执行并回 SSE： 客户端必须按第 9 篇那三条语义解析：拼接事件还原输出（行尾原样）、 execution_complete 的 exit_code 才算结论、流在终止事件前结束就当作不确定。 对应地，如果客户端是老版本 SDK 且 classpath 里有不兼容的 kotlinx-serialization，它可能解不出这个字段而挂住——这就是 EXECD_SSE_LEGACY_COMPAT 存在的原因。 装依赖：出向策略与凭据 Agent 要 pip install 。请求发往 pypi.org ： 1. DNS 被重定向到 sidecar 的 DNS 代理，域名命中 allow 规则，正常解析并记录地址（第 11 篇）； 2. nftables 放行该地址，租约有时限； 3. 如果要访问的是需要认证的内部制品库，请求被 mitmproxy 拦截，绑定匹配后注入认证头；沙箱里的 PIP_INDEX_URL 里只有占位符或假值（第 12 篇）。 如果 Agent 尝试访问 169.254.169.254 或者 metadata.internal ：DNS 返回 NXDOMAIN ，或者包被 nftables 丢弃。平台覆盖规则永远优先于租户规则——即使请求里写了 allow（第 11 篇）。 访问中途：续期与空闲暂停 这个任务跑了 40 分钟。期间客户端每隔一段时间唤醒沙箱访问一次： - 每次经网关的请求都会发布一次 renew-intent ，沙箱的绝对过期时间被延长（第 13 篇）； - 如果客户端停了 10 分钟（超过 idleTimeoutSeconds: 600 ），空闲扫描器把它暂停：Kubernetes 后端会提交 rootfs 镜像、释放 Pod； - 下一次访问时， wakeOnAccess: true 让它自动唤醒，但 地址变了 ，客户端必须重新解析 endpoint（第 13、10 篇）。 如果部署的是 Fast Sandbox，唤醒可能是检查点恢复，并且在 另一台宿主机 上——重新解析不是可选动作。 交付：快照还是 diff 任务结束有两种收尾： 交 diff ：直接用文件 API 从工作区读改动，然后删除沙箱。删除是异步的： DELETE 返回 204 ，之后 GET 会看到 Stopping ，清理完成变 404 。 保留现场 ： POST /sandboxes/{id}/snapshots 创建快照。只有 Running 源可以创建；记录从 Pending → Creating → Publishing → Succeeded ；只有 Succeeded 之后才是一个可复用的起点，从它创建出的是 新沙箱 ID （第 13 篇）。 注意这里有一个不对称：快照成功之后，沙箱本身的后续写入 不会 被自动快照；进程退出、OOM、驱逐都不会自动保存。想要可复现环境，就得显式做快照——这条边界在第 13 篇被反复强调，因为它是「暂停能不能当备份用」的唯一答案。 出问题时，你会在哪里看到 现象 第一现场 哪一篇 --- --- --- 创建 429 PoolAllocationPending 条件、 PoolCapacityExhausted 7 卡在 Pending status.reason 、Pod 事件 4 / 7 命令没输出 缺 execution_complete ，或流被提前切断 9 装依赖失败 egress：域名被拒（DNS）还是包被丢（nft） 11 认证 401/403 vault 未注入、绑定未匹配、路径守卫拒绝 12 恢复后连不上 endpoint 变了，没重新解析 10 / 13 恢复后凭据失效 Kubernetes 后端 vault 为空，需重新注入 12 / 13 日志消失 沙箱已删，需要 node agent 才能留证据 16 这张表是全书的索引：每一行都能追到一个具体机制，而不是一句「看日志」。 如果我要改这块代码 按改动类型给三条路径： 加一个后端。 实现 SandboxService 的 13 个方法，给 ID 一个前缀，在 factory.py 或 Composite 里注册，在兼容性文档里写清不支持的能力（第 5 篇）。不要动 API 与 schema。 改出向策略。 从 components/egress/pkg/policy/ 的规则模型开始，注意优先级（平台 deny → 平台 allow → 用户）、端口地板的补集语义、以及 fast-sandbox profile 的差异（第 11 篇）。任何新增的「放行」路径都要先想清楚它是否绕过了 deny-first。 加一个执行能力。 先看 execd 的分层：命令/文件/PTY 是不同子系统，隔离会话是另一层命名空间（第 9 篇）。新增能力要决定它属于哪一层、是否需要在契约里、以及在池化复用时如何被 per-allocation 绑定重置。 收尾 回到开头那个问题： POST /v1/sandboxes 之后发生了什么。 答案是六件事同时发生：控制面校验并委派、运行时认领已有容量、数据面准备好执行接口、网络装上默认拒绝的策略、凭据被留在沙箱之外、生命周期开始倒计时。它们分别由四个进程、三个后端、四份契约保证，并且每一处不确定都被写成了可检查的字段。 这套系统的价值不在于它有多少功能，而在于它把「承诺」和「不承诺」分得很清。第 18 篇列的那些取舍，本质上都是同一件事的不同侧面： 在能保证的地方给出强保证，在不能保证的地方留下可验证的痕迹。 读到这里，如果你要做一个类似的执行层，我希望你带走的是这句话，而不是任何具体实现： 沙箱平台的难点从来不是把容器跑起来，而是让「隔离」「快」「可解释」这三件事在同一个请求里同时成立，并且诚实地告诉使用者哪一件打了折。 本章要点 - 一次请求会依次穿过：认证与租户 → 校验与委派 → 容量认领 → 就绪 → endpoint 解析 → 命令/文件/代码执行 → 出向策略与凭据 → 续期/空闲暂停 → 快照或删除。 - 每个阶段都有一个「第一现场」：状态字段、条件、事件、指标或日志。 - 三条改动路径：加后端（实现接口 + 前缀 + 文档）、改出向（优先级与 deny-first）、加执行能力（分层与绑定重置）。"},{"title":"附录 A：源码阅读地图","slug":"appendix-map","text":"附录 A：源码阅读地图 这份地图按「读它的目的」组织，不按目录。全部路径相对于上游提交 c2f55b20e945d89efe3d35220942a997a3551751 。 三条阅读路线 路线一：只想把它跑起来并理解调用方视角（半天） 读完你应该能回答：创建沙箱要哪些参数、endpoint 怎么用、命令输出怎么解析。 路线二：要评估或自建执行层（两三天） 再挑一个后端深入：单机看 single-host-network.md ，集群看 fast-sandbox/ 。 路线三：要改代码（一周以上） 按本书顺序读，每章末尾的「源码入口」表就是路线。下面给一张按角色划分的入口表。 按角色划分 控制面（Python） 路径 行数级 看什么 --- --- --- server/opensandbox_server/main.py ~378 lifespan、中间件、路由注册、启动断言 server/opensandbox_server/startup_guard.py ~150 无 API key 时的确认策略 server/opensandbox_server/api/lifecycle.py ~618 创建/查询/删除/暂停路由与校验顺序 server/opensandbox_server/api/proxy.py ~776 代理头处理、 Location 重写、WebSocket server/opensandbox_server/api/schema.py ~1817 契约的 Pydantic 落地 server/opensandbox_server/services/sandbox_service.py ~387 13 个抽象方法 server/opensandbox_server/services/factory.py ~77 配置到实现 server/opensandbox_server/se
