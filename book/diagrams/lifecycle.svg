<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="960" viewBox="0 0 1040 960" role="img" aria-labelledby="lifecycle-title lifecycle-desc"><title id="lifecycle-title">BatchSandbox：运行、暂停与恢复</title><desc id="lifecycle-desc">暂停或恢复失败可能保留可重试状态；删除清理与进程正常或异常退出是不同路径。</desc><style>text{font-family:"Noto Sans CJK SC",system-ui,sans-serif;fill:#252820}.name{font-size:21px;font-weight:650}.label{font-size:17px;fill:#29564c}.sub{font-size:17px;fill:#586354}.node{fill:#faf7ef;stroke:#a5ad9e;stroke-width:1.4}.active{fill:#edf2e9;stroke:#29564c;stroke-width:2}.edge{fill:none;stroke:#29564c;stroke-width:1.6}.return{fill:none;stroke:#72846b;stroke-width:1.5;stroke-dasharray:6 5}</style><defs><marker id="lifecycle-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9" fill="#29564c"/></marker></defs><rect width="1040" height="960" fill="#faf7ef"/>
<text x="40" y="36" class="sub" text-anchor="start">Kubernetes BatchSandbox · 运行状态与可重试的暂停循环</text>
<path class="edge" d="M240 130 H330" marker-end="url(#lifecycle-arrow)"/>
<text x="250" y="111" class="label" text-anchor="start">就绪</text>
<path class="edge" d="M550 115 H680" marker-end="url(#lifecycle-arrow)"/>
<text x="570" y="96" class="label" text-anchor="start">正常退出</text>
<path class="edge" d="M550 150 H592 Q600 150 600 158 V332 Q600 340 608 340 H680" marker-end="url(#lifecycle-arrow)"/>
<text x="616" y="286" class="label" text-anchor="start">异常退出</text>
<path class="edge" d="M440 170 V310" marker-end="url(#lifecycle-arrow)"/>
<text x="456" y="246" class="label" text-anchor="start">请求暂停</text>
<path class="return" d="M330 350 H288 Q280 350 280 342 V218 a8 8 0 0 1 0 -16 V148 Q280 140 288 140 H330" marker-end="url(#lifecycle-arrow)"/>
<text x="96" y="285" class="sub" text-anchor="start">提交失败但仍可用</text>
<path class="edge" d="M440 390 V530" marker-end="url(#lifecycle-arrow)"/>
<text x="456" y="447" class="label" text-anchor="start">镜像推送成功</text>
<text x="456" y="475" class="sub" text-anchor="start">释放 Pod / 槽位</text>
<path class="edge" d="M550 570 H650" marker-end="url(#lifecycle-arrow)"/>
<text x="565" y="550" class="label" text-anchor="start">恢复</text>
<path class="return" d="M760 610 V672 Q760 680 752 680 H448 Q440 680 440 672 V610" marker-end="url(#lifecycle-arrow)"/>
<text x="474" y="659" class="sub" text-anchor="start">未恢复成功：仍可重试</text>
<path class="edge" d="M840 610 V742 Q840 750 832 750 H88 Q80 750 80 742 V218 Q80 210 88 210 H352 Q360 210 360 202 V170" marker-end="url(#lifecycle-arrow)"/>
<text x="96" y="730" class="sub" text-anchor="start">恢复就绪：sandboxId 不变；重新解析 endpoint</text>
<g data-box="1" id="s-pending"><rect class="node" x="40" y="90" width="200" height="80" rx="6"/>
<text x="140.0" y="122" class="name" text-anchor="middle">Pending</text>
<text x="140.0" y="149" class="sub" text-anchor="middle">创建中</text>
</g>
<g data-box="1" id="s-running"><rect class="active" x="330" y="90" width="220" height="80" rx="6"/>
<text x="440.0" y="122" class="name" text-anchor="middle">Running</text>
<text x="440.0" y="149" class="sub" text-anchor="middle">工作负载可用</text>
</g>
<g data-box="1" id="s-terminated"><rect class="node" x="680" y="90" width="240" height="80" rx="6"/>
<text x="800.0" y="122" class="name" text-anchor="middle">Terminated</text>
<text x="800.0" y="149" class="sub" text-anchor="middle">主进程正常退出</text>
</g>
<g data-box="1" id="s-failed"><rect class="node" x="680" y="300" width="240" height="80" rx="6"/>
<text x="800.0" y="332" class="name" text-anchor="middle">Failed</text>
<text x="800.0" y="359" class="sub" text-anchor="middle">不可恢复运行时失败</text>
</g>
<g data-box="1" id="s-pausing"><rect class="node" x="330" y="310" width="220" height="80" rx="6"/>
<text x="440.0" y="342" class="name" text-anchor="middle">Pausing</text>
<text x="440.0" y="369" class="sub" text-anchor="middle">正在提交 rootfs</text>
</g>
<g data-box="1" id="s-paused"><rect class="active" x="330" y="530" width="220" height="80" rx="6"/>
<text x="440.0" y="562" class="name" text-anchor="middle">Paused</text>
<text x="440.0" y="589" class="sub" text-anchor="middle">暂停已完成</text>
</g>
<g data-box="1" id="s-resuming"><rect class="node" x="650" y="530" width="270" height="80" rx="6"/>
<text x="785.0" y="562" class="name" text-anchor="middle">Resuming</text>
<text x="785.0" y="589" class="sub" text-anchor="middle">重建工作负载</text>
</g>
<line x1="40" y1="806" x2="1000" y2="806" stroke="#d9d2c3"/>
<text x="40" y="840" class="sub" text-anchor="start">PauseFailed / ResumeFailed 是条件，不必然代表 Failed 状态。</text>
<text x="40" y="872" class="sub" text-anchor="start">DELETE：接受清理 → 可观察到 Stopping → 清理后 GET 返回 404。</text>
<text x="40" y="904" class="sub" text-anchor="start">删除不是正常退出；此图省略其他阶段的不可恢复失败边。</text>
</svg>